<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Namaste Work.Life</title>
    <meta name="description" content="Namaste Work.Life: Zero to Hero — a real data &amp; AI project, end to end." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🙏</text></svg>" />
    <script>
      // Set the theme before first paint so dark-mode readers never see a light flash.
      (function () {
        var t
        try { t = localStorage.getItem('nv-theme') } catch (e) {}
        if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      })()
    </script>
    <style>
      /* Chat-app layout: sidebar of chapters, one centred reading column, composer-style bar */
      :root {
        --side-w: 260px;
        --top-h: 52px;
        --col-w: 768px;

        --main: #0d0d0d;
        --text: #0d0d0d;
        --alt: #5d5d5d;
        --muted: #8f8f8f;
        --link: #0b6bcb;
        --bg: #ffffff;
        --side: #f9f9f9;
        --hover: #ececec;
        --active: #e3e3e3;
        --bubble: #f4f4f4;
        --composer: #ffffff;
        --border: #e5e5e5;
        --line: #e5e5e5;
        --zebra: transparent;
        --input: #ececec;
        --pre: #f9f9f9;
        --pre-text: #0d0d0d;
        --code: #0d0d0d;
        --code-bg: #ececec;
        --warn: #e8890c;
        --shadow: 0 4px 16px rgba(0, 0, 0, 0.05), 0 0 1px rgba(0, 0, 0, 0.1);

        --font-body: ui-sans-serif, -apple-system, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif;
        --font-head: var(--font-body);
        --font-mono: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
        color-scheme: light;
      }

      [data-theme='dark'] {
        --main: #ececec;
        --text: #ececec;
        --alt: #b4b4b4;
        --muted: #8f8f8f;
        --link: #7ab7ff;
        --bg: #212121;
        --side: #181818;
        --hover: #2a2a2a;
        --active: #303030;
        --bubble: #303030;
        --composer: #303030;
        --border: #383838;
        --line: #424242;
        --input: #2a2a2a;
        --pre: #171717;
        --pre-text: #ececec;
        --code: #ececec;
        --code-bg: #424242;
        --shadow: none;
        color-scheme: dark;
      }

      *, *::before, *::after { box-sizing: border-box; }
      html { scroll-padding-top: calc(var(--top-h) + 16px); }
      body {
        margin: 0;
        font-family: var(--font-body);
        font-size: 16px;
        color: var(--text);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
      }
      a { color: var(--link); text-decoration: none; }
      button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
      svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

      .app { display: flex; min-height: 100vh; }

      .icon-btn {
        display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
        width: 36px; height: 36px; border-radius: 8px; color: var(--alt);
      }
      .icon-btn:hover { background: var(--hover); color: var(--main); }
      .icon-btn svg { width: 20px; height: 20px; }

      /* ---------- sidebar ---------- */
      .side {
        position: sticky; top: 0; flex-shrink: 0;
        display: flex; flex-direction: column;
        width: var(--side-w); height: 100vh;
        background: var(--side);
      }
      .side-top { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 4px 12px; }
      .brand { display: flex; align-items: center; gap: 8px; color: var(--main); font-size: 15px; font-weight: 600; white-space: nowrap; }
      .brand-mark { font-size: 18px; }

      .side-search { position: relative; margin: 6px 8px 4px; }
      .side-search svg { position: absolute; left: 11px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); color: var(--alt); }
      .side-search input {
        width: 100%; padding: 8px 10px 8px 34px;
        border: 0; border-radius: 8px; outline: 0;
        background: transparent; color: var(--main); font: inherit; font-size: 14px;
      }
      .side-search input::placeholder { color: var(--main); }
      .side-search input:hover, .side-search input:focus { background: var(--hover); }
      .side-search input:focus::placeholder { color: var(--muted); }

      .navigation {
        flex: 1; overflow-y: auto; min-height: 0;
        padding: 4px 8px 16px;
        font-size: 14px;
        scrollbar-width: thin; scrollbar-color: var(--border) transparent;
      }
      .navigation ul { list-style: none; margin: 0; padding: 0; }
      .navigation .home a {
        display: flex; align-items: center; gap: 10px;
        padding: 8px 10px; border-radius: 8px; color: var(--main);
      }
      .navigation .home svg { width: 18px; height: 18px; }
      .navigation .home a:hover { background: var(--hover); }
      .navigation .home.active a { background: var(--active); }

      .group { margin-top: 14px; }
      .group-head {
        display: flex; align-items: center; gap: 6px; width: 100%;
        padding: 4px 10px 6px; text-align: left;
        font-size: 12px; font-weight: 500; color: var(--muted);
      }
      .group-head:hover { color: var(--main); }
      .group-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .group .dot, .group-sub { display: none; }
      .chev { width: 13px; height: 13px; opacity: 0; transition: transform 0.2s, opacity 0.2s; }
      .group-head:hover .chev, .group:not(.open) .chev { opacity: 1; }
      .group.open .chev { transform: rotate(90deg); }
      .group > ul { display: none; }
      .group.open > ul { display: block; }

      .chapter > a, .chapter.planned {
        display: flex; align-items: center; gap: 8px;
        padding: 8px 10px; border-radius: 8px;
        color: var(--main); line-height: 1.3; white-space: nowrap;
      }
      .chapter .num { flex-shrink: 0; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
      .chapter .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      .chapter > a:hover { background: var(--hover); }
      .chapter.active > a { background: var(--active); }
      .chapter.planned { color: var(--muted); cursor: default; }
      .chapter.missing > a { color: var(--alt); }
      .tag {
        flex-shrink: 0; padding: 1px 6px; border-radius: 4px;
        font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em;
        color: var(--link); border: 1px solid currentColor;
      }
      .todo-dot { flex-shrink: 0; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
      .nav-caption { display: flex; justify-content: space-between; padding: 6px 10px 8px; font-size: 12px; color: var(--muted); }
      .nav-caption button { color: var(--link); }

      .side-foot { display: flex; align-items: center; gap: 10px; padding: 8px; border-top: 1px solid var(--border); }
      .side-foot .who { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; padding: 6px; border-radius: 8px; }
      .avatar {
        display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        width: 30px; height: 30px; border-radius: 50%;
        background: var(--main); color: var(--bg); font-size: 12px; font-weight: 600;
      }
      .who-text { min-width: 0; line-height: 1.25; }
      .who-text b { display: block; font-size: 14px; font-weight: 500; color: var(--main); }
      .who-text span { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dark-switch span { display: none; }
      .dark-switch .sun, [data-theme='dark'] .dark-switch .moon { display: none; }
      [data-theme='dark'] .dark-switch .sun { display: block; }

      .nav-overlay { display: none; }

      /* ---------- chat column ---------- */
      .chat { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }

      .topbar {
        position: sticky; top: 0; z-index: 10;
        display: flex; align-items: center; gap: 6px;
        height: var(--top-h); padding: 0 8px;
        background: var(--bg);
      }
      .topbar .side-toggle { display: none; }
      .side-closed .topbar .side-toggle { display: inline-flex; }
      .top-title {
        display: flex; align-items: center; gap: 6px; min-width: 0;
        padding: 6px 10px; border-radius: 8px;
        font-size: 17px; font-weight: 500; color: var(--main); white-space: nowrap;
      }
      .top-title:hover { background: var(--hover); }
      .top-crumb { min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-weight: 400; font-size: 15px; }
      .top-share {
        display: inline-flex; align-items: center; gap: 6px; margin-left: auto; flex-shrink: 0;
        padding: 7px 12px; border-radius: 999px; border: 1px solid var(--border);
        font-size: 14px; color: var(--main);
      }
      .top-share:hover { background: var(--hover); }
      .top-share svg { width: 16px; height: 16px; }

      .main { flex: 1; padding: 0 16px; }
      .thread { max-width: var(--col-w); margin: 0 auto; padding: 16px 0 32px; }
      .skeleton { color: var(--muted); text-align: center; padding: 80px 20px; }

      .msg-user { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; margin: 8px 0 28px; }
      .msg-crumb { font-size: 12px; color: var(--muted); }
      .bubble {
        max-width: 70%; padding: 10px 18px; border-radius: 22px;
        background: var(--bubble); color: var(--main); line-height: 1.5;
        overflow-wrap: anywhere;
      }

      .msg-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; margin-top: 12px; font-size: 13px; color: var(--muted); }
      .msg-actions span, .msg-actions a { display: inline-flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 8px; color: var(--muted); }
      .msg-actions a:hover { background: var(--hover); color: var(--main); }
      .msg-actions svg { width: 16px; height: 16px; }

      .post-body { line-height: 1.75; font-size: 16px; overflow-wrap: break-word; }
      .post-body h2, .post-body h3, .post-body h4 { color: var(--main); font-weight: 600; line-height: 1.4; }
      .post-body h2 { font-size: 1.5rem; margin: 1.6em 0 0.6em; }
      .post-body h3 { font-size: 1.25rem; margin: 1.6em 0 0.5em; }
      .post-body h4 { font-size: 1.05rem; margin: 1.3em 0 0.4em; }
      .post-body > :first-child { margin-top: 0; }
      .post-body p { margin: 0 0 1em; }
      .post-body ul, .post-body ol { padding-left: 26px; margin: 0 0 1em; }
      .post-body li { margin: 0.3em 0; }
      .post-body b, .post-body strong { color: var(--main); font-weight: 600; }
      .post-body a { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
      .post-body a.is-missing { color: var(--alt); text-decoration-style: dashed; }
      .post-body a.is-missing::after { content: ' · soon'; font-size: 11px; color: var(--warn); }
      .post-body hr { border: 0; border-top: 1px solid var(--border); margin: 32px 0; }
      .post-body img { max-width: 100%; height: auto; border-radius: 12px; }
      .post-body blockquote { margin: 20px 0; padding: 2px 0 2px 16px; border-left: 3px solid var(--line); color: var(--alt); }

      .post-body pre {
        margin: 20px 0; padding: 16px;
        background: var(--pre); color: var(--pre-text);
        border: 1px solid var(--border); border-radius: 16px; overflow: auto;
        font-family: var(--font-mono); font-size: 13.5px; line-height: 1.5; tab-size: 2;
      }
      .post-body pre code { background: none; color: inherit; padding: 0; font-size: inherit; }
      .post-body code, .code {
        padding: 2px 5px; border-radius: 5px;
        font-family: var(--font-mono); font-size: 0.875em;
        color: var(--code); background: var(--code-bg);
      }

      .post-body .table { display: block; overflow-x: auto; margin: 20px 0; }
      .post-body table { width: 100%; border-collapse: collapse; font-size: 14.5px; line-height: 1.5; }
      .post-body th {
        padding: 8px 12px; text-align: left; white-space: nowrap;
        font-weight: 600; color: var(--main);
        border-bottom: 1px solid var(--line);
      }
      .post-body td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
      .post-body tr:last-child td { border-bottom: 0; }

      /* index.html timeline (.nz-*) brings its own light styles; adapt for night mode */
      [data-theme='dark'] .post-body .nz-step { border-left-color: #424242; }
      [data-theme='dark'] .post-body .nz-step.nz-blue { border-left-color: var(--link); }
      [data-theme='dark'] .post-body .nz-icon { background: var(--bg); border-color: var(--main); }
      [data-theme='dark'] .post-body .nz-written .nz-icon { background: var(--link); border-color: var(--link); }
      [data-theme='dark'] .post-body .nz-planned .nz-icon { border-color: var(--muted); }
      [data-theme='dark'] .post-body .nz-title { color: var(--main); }
      [data-theme='dark'] .post-body .nz-sub, [data-theme='dark'] .post-body .nz-legend { color: var(--alt); }
      [data-theme='dark'] .post-body .nz-step ul { color: var(--text); }
      [data-theme='dark'] .post-body .nz-planned .nz-title,
      [data-theme='dark'] .post-body .nz-planned .nz-sub,
      [data-theme='dark'] .post-body .nz-planned ul { color: var(--muted); }

      /* CSV explorer */
      .csv-tools { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; font-size: 13px; color: var(--muted); }
      .csv-tools input {
        width: 260px; max-width: 100%; padding: 9px 14px;
        border: 1px solid var(--border); border-radius: 999px; outline: 0;
        background: var(--bg); color: var(--main); font: inherit; font-size: 14px;
      }
      .csv-tools input:focus { border-color: var(--muted); }
      .post-body table.csv { font-size: 13px; }
      .post-body table.csv th { cursor: pointer; user-select: none; }
      .post-body table.csv th:hover { color: var(--link); }
      .post-body table.csv td { padding: 6px 12px; white-space: nowrap; }
      .post-body table.csv .num { text-align: right; font-family: var(--font-mono); font-size: 12.5px; }
      .sort { color: var(--link); }

      .button { display: inline-block; margin-top: 6px; padding: 9px 18px; border-radius: 999px; background: var(--main); color: var(--bg); font-size: 14px; font-weight: 500; }

      /* ---------- composer-style bar (previous / next) ---------- */
      .composer {
        position: sticky; bottom: 0; z-index: 10;
        padding: 12px 16px 8px;
        background: linear-gradient(to bottom, transparent, var(--bg) 24px);
      }
      .composer-box {
        display: flex; align-items: center; gap: 6px;
        max-width: var(--col-w); margin: 0 auto; padding: 8px;
        background: var(--composer); border: 1px solid var(--border); border-radius: 28px;
        box-shadow: var(--shadow);
      }
      .composer-box:empty { display: none; }
      .c-btn {
        display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
        width: 36px; height: 36px; border-radius: 50%; color: var(--main);
      }
      .c-btn:hover { background: var(--hover); }
      .c-btn.disabled { color: var(--muted); opacity: 0.4; pointer-events: none; }
      .c-btn svg, .c-send svg { width: 18px; height: 18px; }
      .c-input {
        flex: 1; min-width: 0; padding: 6px 4px;
        color: var(--muted); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .c-input b { color: var(--main); font-weight: 400; }
      .c-send {
        display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
        width: 36px; height: 36px; border-radius: 50%;
        background: var(--main); color: var(--bg);
      }
      .c-send:hover { opacity: 0.8; }
      .footnote { max-width: var(--col-w); margin: 8px auto 0; text-align: center; font-size: 12px; color: var(--muted); }

      /* ---------- responsive ---------- */
      @media (min-width: 861px) {
        .side-closed .side { display: none; }
      }
      @media (max-width: 860px) {
        .side {
          position: fixed; left: 0; top: 0; z-index: 40;
          width: min(var(--side-w), 85vw);
          transform: translateX(-100%); transition: transform 0.25s ease-out;
        }
        .nav-open .side { transform: none; }
        .nav-open .nav-overlay { display: block; position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, 0.4); }
        .topbar .side-toggle { display: inline-flex; }
        .top-crumb { display: none; }
        .top-share span { display: none; }
        .bubble { max-width: 85%; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="side">
        <div class="side-top">
          <a href="#/index.html" class="brand"><span class="brand-mark">🙏</span><span>Namaste Work.Life</span></a>
          <button class="icon-btn side-toggle" aria-label="Close sidebar" title="Close sidebar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3" /><path d="M9 4v16" /></svg>
          </button>
        </div>
        <div class="side-search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
          <input id="search" type="text" placeholder="Search chapters" autocomplete="off" />
        </div>
        <nav class="navigation"></nav>
        <div class="side-foot">
          <div class="who">
            <span class="avatar">NW</span>
            <span class="who-text"><b>Zero to Hero</b><span class="side-stats">Educational series</span></span>
          </div>
          <button class="icon-btn dark-switch" aria-label="Switch to dark mode" title="Switch to dark mode">
            <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg>
            <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
            <span>Dark mode</span>
          </button>
        </div>
      </aside>
      <div class="nav-overlay"></div>
      <div class="chat">
        <header class="topbar">
          <button class="icon-btn side-toggle" aria-label="Open sidebar" title="Open sidebar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3" /><path d="M9 4v16" /></svg>
          </button>
          <a href="#/index.html" class="top-title">Namaste Work.Life <span class="top-crumb"></span></a>
          <a class="top-share" href="https://github.com/shreyash510/workLifeDataAi" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" /></svg>
            <span>GitHub</span>
          </a>
        </header>
        <main class="main"><div class="thread skeleton">Reading tutorial…</div></main>
        <div class="composer">
          <div class="composer-box"></div>
          <p class="footnote">Educational purposes only. Lab numbers are made up.</p>
        </div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
