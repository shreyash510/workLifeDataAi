<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Namaste Work.Life</title>
    <meta name="description" content="Namaste Work.Life: Zero to Hero — a real data &amp; AI project, end to end." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Mono&family=Nunito+Sans:ital,wght@0,400;0,700;1,400&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🙏</text></svg>" />
    <style>
      /* Tokens taken from blogger-template/template.xml (light + night mode) */
      :root {
        --nav-w: 220px;
        --side-w: 360px;
        --header-h: 60px;

        --main: #161617;
        --text: #48525c;
        --alt: #767676;
        --link: #005af0;
        --bg: #fafafc;
        --card: #ffffff;
        --header: #fefefe;
        --border: #ebeced;
        --line: #dddddd;
        --zebra: rgba(0, 0, 0, 0.025);
        --hover: rgba(0, 90, 240, 0.06);
        --input: rgba(236, 239, 241, 0.8);
        --pre: #29323c;
        --code: #f15a5a;
        --code-bg: rgba(0, 0, 0, 0.05);
        --muted: #a8a8a8;
        --warn: #f1a33a;
        --shadow: 0 5px 35px rgba(0, 0, 0, 0.07);

        --font-body: 'Nunito Sans', sans-serif;
        --font-head: Poppins, sans-serif;
        --font-mono: 'Fira Mono', monospace;
        color-scheme: light;
      }

      [data-theme='dark'] {
        --main: #fefefe;
        --text: #c9cbcf;
        --alt: #989b9f;
        --link: #4d8dff;
        --bg: #1e1e1e;
        --card: #252526;
        --header: #252526;
        --border: #3a3a3d;
        --line: #3e3e42;
        --zebra: rgba(255, 255, 255, 0.03);
        --hover: rgba(77, 141, 255, 0.1);
        --input: #2d2d30;
        --pre: #1a1d22;
        --code: #ff8080;
        --code-bg: rgba(255, 255, 255, 0.07);
        --muted: #6f7175;
        --shadow: none;
        color-scheme: dark;
      }

      *, *::before, *::after { box-sizing: border-box; }
      html { scroll-padding-top: calc(var(--header-h) + 20px); }
      body {
        margin: 0;
        font-family: var(--font-body);
        font-size: 15px;
        color: var(--text);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
      }
      a { color: var(--link); text-decoration: none; }
      button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
      svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

      /* ---------- layout ---------- */
      .app {
        display: grid;
        grid-template-columns: var(--nav-w) minmax(0, 1fr) var(--side-w);
        grid-template-rows: var(--header-h) 1fr;
        min-height: 100vh;
      }

      /* ---------- header ---------- */
      .header {
        grid-column: 1 / -1;
        position: sticky; top: 0; z-index: 30;
        display: flex; align-items: center; gap: 20px;
        height: var(--header-h);
        padding-right: 20px;
        background: var(--header);
        border-bottom: 1px solid var(--border);
      }
      .brand { display: flex; align-items: center; width: var(--nav-w); padding-left: 20px; flex-shrink: 0; }
      .brand-name { display: flex; align-items: center; gap: 8px; color: var(--main); font-family: var(--font-head); font-size: 15px; font-weight: 600; white-space: nowrap; }
      .brand-name b { color: var(--link); }
      .brand-mark { font-size: 20px; }
      .burger { display: none; flex-direction: column; justify-content: center; width: 34px; height: 34px; margin-right: 8px; }
      .burger i { display: block; width: 20px; height: 2px; margin: 2px 0; border-radius: 2px; background: var(--main); }

      .searchbar { position: relative; flex: 1; min-width: 0; max-width: 520px; }
      .searchbar svg { position: absolute; left: 15px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); color: var(--alt); }
      .searchbar input {
        width: 100%; padding: 11px 20px 11px 42px;
        border: 0; border-radius: 5px; outline: 0;
        background: var(--input); color: var(--main); font: inherit; font-size: 14px;
        transition: box-shadow 0.3s;
      }
      .searchbar input:focus { box-shadow: 0 0 0 2px var(--link); }

      .dark-switch { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--alt); }
      .dark-switch i { position: relative; width: 30px; height: 10px; border-radius: 8px; background: rgba(128, 128, 128, 0.3); }
      .dark-switch i::before {
        content: ''; position: absolute; top: -4px; left: 0;
        width: 18px; height: 18px; border-radius: 50%; background: var(--link);
        transition: transform 0.2s ease-out;
      }
      .dark-switch i.on::before { transform: translateX(12px); }

      /* ---------- left navigation ---------- */
      .navigation {
        position: sticky; top: var(--header-h);
        height: calc(100vh - var(--header-h));
        overflow-y: auto;
        padding: 18px 0 40px;
        background: var(--header);
        border-right: 1px solid var(--border);
        font-size: 13.5px;
      }
      .navigation ul { list-style: none; margin: 0; padding: 0; }
      .navigation .home a {
        display: flex; align-items: center; gap: 10px;
        margin: 0 12px 8px; padding: 10px 12px; border-radius: 8px;
        color: var(--main); font-weight: 700;
      }
      .navigation .home svg { width: 18px; height: 18px; }
      .navigation .home.active a, .navigation .home a:hover { background: var(--hover); color: var(--link); }

      .group { margin: 2px 0; }
      .group-head {
        display: flex; align-items: center; gap: 10px; width: 100%;
        padding: 9px 20px 4px 24px; text-align: left;
        font-family: var(--font-head); font-size: 12.5px; font-weight: 600; color: var(--main);
      }
      .group-title { flex: 1; }
      .group .dot { width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--link); flex-shrink: 0; }
      .group.written .dot, .group.live .dot { background: var(--link); }
      .group.planned .dot { border-color: var(--muted); }
      .group.planned .group-title { color: var(--alt); }
      .chev { width: 14px; height: 14px; color: var(--alt); transition: transform 0.2s; }
      .group.open .chev { transform: rotate(90deg); }
      .group-sub { padding: 0 20px 6px 42px; font-size: 11px; color: var(--alt); line-height: 1.4; }
      .group > ul { display: none; padding-bottom: 6px; }
      .group.open > ul { display: block; }

      .chapter > a, .chapter.planned {
        display: flex; align-items: baseline; gap: 8px;
        margin: 1px 10px 1px 22px; padding: 6px 10px; border-radius: 6px;
        color: var(--text); line-height: 1.35;
      }
      .chapter .num { flex-shrink: 0; min-width: 18px; font-family: var(--font-mono); font-size: 11px; color: var(--alt); }
      .chapter .name { flex: 1; }
      .chapter > a:hover { background: var(--hover); color: var(--main); }
      .chapter.active > a { background: var(--link); color: #fff; }
      .chapter.active .num { color: rgba(255, 255, 255, 0.75); }
      .chapter.planned { color: var(--muted); cursor: default; }
      .chapter.missing > a { color: var(--alt); }
      .tag {
        flex-shrink: 0; align-self: center;
        padding: 1px 6px; border-radius: 4px;
        font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
        color: var(--warn); border: 1px solid currentColor;
      }
      .tag.new { color: var(--link); }
      .todo-dot { flex-shrink: 0; align-self: center; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
      .chapter.active .tag { color: #fff; }
      .nav-caption { display: flex; justify-content: space-between; padding: 0 22px 10px; font-size: 12px; color: var(--alt); }
      .nav-caption button { color: var(--link); }
      .flat .chapter > a { margin-left: 10px; }

      /* ---------- main post ---------- */
      .main { padding: 25px; min-width: 0; }
      .post-card {
        max-width: 880px; margin: 0 auto;
        padding: 35px 40px 40px;
        background: var(--card);
        border-radius: 20px;
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
      }
      .skeleton { color: var(--alt); text-align: center; padding: 80px 20px; }

      .breadcrumbs { display: flex; gap: 8px; margin-bottom: 10px; font-size: 11px; font-weight: 700; font-family: var(--font-head); color: var(--alt); }
      .post-title { margin: 0 0 12px; font-family: var(--font-head); font-size: 1.75rem; line-height: 1.3; color: var(--main); }
      .post-meta {
        display: flex; flex-wrap: wrap; gap: 6px 18px;
        padding-bottom: 20px; margin-bottom: 25px;
        border-bottom: 2px solid var(--border);
        font-size: 12.5px; color: var(--alt);
      }

      .post-body { line-height: 1.75em; font-size: 15.5px; overflow-wrap: break-word; }
      .post-body h2, .post-body h3, .post-body h4 { font-family: var(--font-head); color: var(--main); line-height: 1.4; }
      .post-body h2 { font-size: 1.45rem; margin: 1.6em 0 0.6em; }
      .post-body h3 { font-size: 1.3rem; margin: 1.5em 0 0.6em; }
      .post-body h4 { font-size: 1.1rem; margin: 1.3em 0 0.5em; }
      .post-body > :first-child { margin-top: 0; }
      .post-body p { margin: 0 0 1.1em; }
      .post-body ul, .post-body ol { padding-left: 22px; margin: 0 0 1.2em; }
      .post-body li { margin: 0.25em 0; }
      .post-body b, .post-body strong { color: var(--main); }
      .post-body a { text-decoration: underline; text-decoration-color: rgba(0, 90, 240, 0.3); text-underline-offset: 3px; }
      .post-body a:hover { text-decoration-color: currentColor; }
      .post-body a.is-missing { color: var(--alt); text-decoration-style: dashed; }
      .post-body a.is-missing::after { content: ' · soon'; font-size: 11px; color: var(--warn); }
      .post-body hr { border: 0; margin: 35px 0; text-align: center; }
      .post-body hr::before { content: '\2027 \2027 \2027'; display: block; color: var(--alt); font-size: 26px; letter-spacing: 0.6em; text-indent: 0.6em; }
      .post-body img { max-width: 100%; height: auto; border-radius: 8px; }
      .post-body blockquote { margin: 25px 0; padding: 20px 25px; border-radius: 4px; border: 2px solid var(--border); }

      .post-body pre {
        position: relative; width: 100%; margin: 25px 0; padding: 20px;
        background: var(--pre); color: rgba(255, 255, 255, 0.9);
        border-radius: 8px; overflow: auto;
        font-family: var(--font-mono); font-size: 13px; line-height: 1.5em; tab-size: 2;
      }
      .post-body pre code { background: none; color: inherit; padding: 0; font-size: inherit; }
      .post-body code, .code {
        padding: 2px 5px; border-radius: 3px;
        font-family: var(--font-mono); font-size: 85%;
        color: var(--code); background: var(--code-bg);
      }

      /* tables — same treatment as the template's .Blog table */
      .post-body .table { display: block; overflow-x: auto; margin: 25px 0; border-radius: 10px; border: 1px solid var(--line); }
      .post-body table { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 1.5; }
      .post-body th {
        padding: 13px 18px; text-align: left; white-space: nowrap;
        font-family: var(--font-head); font-size: 12.5px; color: var(--main);
        border-bottom: 1px solid var(--line); border-right: 1px solid var(--line);
        background: var(--zebra);
      }
      .post-body td { padding: 12px 18px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); vertical-align: top; }
      .post-body tr > :last-child { border-right: 0; }
      .post-body tbody tr:last-child td, .post-body table tr:last-child td { border-bottom: 0; }
      .post-body tr:nth-child(2n) td { background: var(--zebra); }

      /* index.html timeline (.nz-*) brings its own light styles; adapt for night mode */
      [data-theme='dark'] .post-body .nz-step { border-left-color: #3e3e42; }
      [data-theme='dark'] .post-body .nz-step.nz-blue { border-left-color: var(--link); }
      [data-theme='dark'] .post-body .nz-icon { background: var(--card); border-color: var(--main); }
      [data-theme='dark'] .post-body .nz-written .nz-icon { background: var(--link); border-color: var(--link); }
      [data-theme='dark'] .post-body .nz-planned .nz-icon { border-color: var(--muted); }
      [data-theme='dark'] .post-body .nz-title { color: var(--main); }
      [data-theme='dark'] .post-body .nz-sub, [data-theme='dark'] .post-body .nz-legend { color: var(--alt); }
      [data-theme='dark'] .post-body .nz-step ul { color: var(--text); }
      [data-theme='dark'] .post-body .nz-planned .nz-title,
      [data-theme='dark'] .post-body .nz-planned .nz-sub,
      [data-theme='dark'] .post-body .nz-planned ul { color: var(--muted); }

      /* CSV explorer */
      .csv-tools { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; font-size: 13px; color: var(--alt); }
      .csv-tools input {
        width: 260px; max-width: 100%; padding: 9px 14px;
        border: 1px solid var(--line); border-radius: 6px; outline: 0;
        background: var(--input); color: var(--main); font: inherit;
      }
      .csv-tools input:focus { border-color: var(--link); }
      .post-body table.csv { font-size: 13px; }
      .post-body table.csv th { cursor: pointer; user-select: none; }
      .post-body table.csv th:hover { color: var(--link); }
      .post-body table.csv td { padding: 8px 14px; white-space: nowrap; }
      .post-body table.csv .num { text-align: right; font-family: var(--font-mono); font-size: 12.5px; }
      .sort { color: var(--link); }

      /* not written yet */
      .post-card.empty { text-align: center; padding: 60px 40px; }
      .empty-icon { font-size: 44px; margin-bottom: 10px; }
      .button { display: inline-block; margin-top: 10px; padding: 11px 22px; border-radius: 6px; background: var(--link); color: #fff; font-family: var(--font-head); font-size: 13px; font-weight: 600; }

      /* previous / next */
      .post-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; max-width: 880px; margin: 20px auto 0; }
      .post-nav a {
        display: block; padding: 18px 22px; border-radius: 15px;
        background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow);
        transition: border-color 0.2s;
      }
      .post-nav a:hover { border-color: var(--link); }
      .post-nav .next { text-align: right; }
      .nav-label { display: block; font-size: 12px; color: var(--alt); }
      .nav-title { display: block; margin-top: 3px; font-family: var(--font-head); font-weight: 600; font-size: 13.5px; color: var(--main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      /* ---------- right sidebar ---------- */
      .sidebar {
        position: sticky; top: var(--header-h);
        height: calc(100vh - var(--header-h));
        overflow-y: auto;
        padding: 25px 25px 40px 0;
      }
      .widget {
        margin-bottom: 20px; padding: 22px 24px;
        background: var(--card); border: 1px solid var(--border); border-radius: 20px;
        box-shadow: var(--shadow);
      }
      .widget-title { margin: 0 0 14px; font-family: var(--font-head); font-size: 14px; color: var(--main); }
      .toc ol { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--border); }
      .toc li button {
        display: block; width: 100%; text-align: left;
        margin-left: -2px; padding: 5px 0 5px 14px;
        border-left: 2px solid transparent;
        font-size: 13px; line-height: 1.4; color: var(--text);
      }
      .toc li.lvl-4 button { padding-left: 28px; font-size: 12.5px; }
      .toc li button:hover { color: var(--main); }
      .toc li.active button { border-left-color: var(--link); color: var(--link); font-weight: 700; }

      .progress { display: flex; gap: 3px; height: 10px; border-radius: 6px; overflow: hidden; }
      .progress span { min-width: 0; }
      .progress .ready, .legend .ready { background: var(--link); }
      .progress .missing, .legend .missing { background: var(--warn); }
      .progress .planned, .legend .planned { background: var(--line); }
      .legend { list-style: none; margin: 14px 0 0; padding: 0; font-size: 12.5px; }
      .legend li { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
      .legend i { width: 10px; height: 10px; border-radius: 3px; }
      .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); text-align: center; }
      .stat-row b { display: block; font-family: var(--font-head); font-size: 20px; color: var(--main); }
      .stat-row span { font-size: 11.5px; color: var(--alt); }
      .source code { display: block; padding: 8px 10px; border-radius: 6px; background: var(--code-bg); font-family: var(--font-mono); font-size: 11.5px; word-break: break-all; color: var(--main); }
      .source p { margin: 10px 0 0; font-size: 12.5px; color: var(--alt); }

      .nav-overlay { display: none; }

      /* ---------- responsive ---------- */
      @media (max-width: 1200px) {
        .app { grid-template-columns: var(--nav-w) minmax(0, 1fr); }
        .sidebar { display: none; }
      }
      @media (max-width: 860px) {
        .app { grid-template-columns: minmax(0, 1fr); }
        .brand { width: auto; padding-left: 12px; }
        .burger { display: flex; }
        .header { gap: 12px; padding-right: 16px; }
        .brand-name span:last-child { display: none; }
        .dark-switch span { display: none; }
        .navigation {
          position: fixed; left: 0; top: var(--header-h); z-index: 25;
          width: 280px; transform: translateX(-100%); transition: transform 0.25s ease-out;
        }
        .nav-open .navigation { transform: none; }
        .nav-open .nav-overlay { display: block; position: fixed; inset: var(--header-h) 0 0 0; z-index: 20; background: rgba(0, 0, 0, 0.35); }
        .main { padding: 16px; }
        .post-card { padding: 24px 20px 28px; border-radius: 15px; }
        .post-title { font-size: 1.4rem; }
        .post-nav { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="brand">
          <button class="icon-btn burger" aria-label="Toggle menu"><i></i><i></i><i></i></button>
          <a href="#/index.html" class="brand-name">
            <span class="brand-mark">🙏</span>
            <span>Namaste <b>Work.Life</b></span>
          </a>
        </div>
        <div class="searchbar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
          <input id="search" type="text" placeholder="Search chapters and data…" autocomplete="off" />
        </div>
        <button class="dark-switch" aria-label="Toggle dark mode" title="Dark mode"><span>Light</span><i></i></button>
      </header>
      <nav class="navigation"></nav>
      <div class="nav-overlay"></div>
      <main class="main"><div class="post-card skeleton">Reading tutorial…</div></main>
      <aside class="sidebar"></aside>
    </div>
    <script src="app.js"></script>
  </body>
</html>
